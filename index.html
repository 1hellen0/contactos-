<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contactos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Gestor de Contactos</h1>
                <p>Administra tus personas de forma simple.</p>
            </div>
        </header>

        <div class="grid">
            <section class="panel">
                <h2>Agregar contacto</h2>
                <form>
                    <input type="text" placeholder="Nombre completo">
                    <input type="email" placeholder="Correo electrónico">
                    <input type="tel" placeholder="Teléfono">
                    <input type="text" placeholder="Empresa">
                    <button type="submit">Guardar</button>
                </form>
            </section>

            <section class="panel">
                <h2>Contactos</h2>
                <input class="search" type="text" placeholder="Buscar contacto...">
                <ul class="contact-list">
                    <li class="contact-item">
                        <div>
                            <strong>María López</strong><br>
                            <small>555-1234</small>
                        </div>
                        <span>Editar</span>
                    </li>
                    <li class="contact-item">
                        <div>
                            <strong>José Pérez</strong><br>
                            <small>555-5678</small>
                        </div>
                        <span>Editar</span>
                    </li>
                    <li class="contact-item">
                        <div>
                            <strong>Ana García</strong><br>
                            <small>555-9012</small>
                        </div>
                        <span>Editar</span>
                    </li>
                </ul>
            </section>
        </div>
    </div>

    <div class="confirm-overlay hidden" id="confirmOverlay">
        <div class="confirm-box">
            <p id="confirmMessage">¿Eliminar este contacto?</p>
            <div class="confirm-actions">
                <button type="button" class="action-btn" id="confirmCancel">Cancelar</button>
                <button type="button" class="action-btn delete-btn" id="confirmAccept">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
